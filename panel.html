<style>
/* Layout: black brand bar like the site's marquee, then an iFood-style order board (4 status columns; one at a time on phones) and a Sales tab. */
:root{

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101010;--card:#1a1a19;--ink:#f1f1ee;--mut:#9b9b96;--line:#2d2d2b;--bar:#000000;--barink:#ffffff;
  --cheese:#f1f1ee;--bun:#5c5c5a;--ok:#f1f1ee;--bad:#f1f1ee;
  --chip-new:#f1f1ee;--chip-prep:#2d2d2b;--chip-ok:#1a1a19;--chip-bad:#f1f1ee;--chip-newink:#101010;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101010;--card:#1a1a19;--ink:#f1f1ee;--mut:#9b9b96;--line:#2d2d2b;--bar:#000000;--barink:#ffffff;
  --cheese:#f1f1ee;--bun:#5c5c5a;--ok:#f1f1ee;--bad:#f1f1ee;
  --chip-new:#f1f1ee;--chip-prep:#2d2d2b;--chip-ok:#1a1a19;--chip-bad:#f1f1ee;--chip-newink:#101010;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--d);font-size:14px;line-height:1.45;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}

/* brand bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bar);color:var(--barink)}

.tabs{display:flex;gap:4px;margin-left:auto}

.new{border:0;background:#ffffff;color:#161616;padding:10px 16px;font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;border-radius:3px}

.sndbtn{border:1px solid var(--barink);background:none;color:var(--barink);padding:9px 12px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;border-radius:3px}

.main{max-width:1320px;margin:0 auto;padding-block:18px 60px}

.col>header{display:flex;align-items:center;gap:8px;padding:0 2px 10px}

.chart svg{width:100%;height:auto;display:block}

.tw{overflow-x:auto;margin-top:4px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:600;padding:8px 8px;border-bottom:1px solid var(--line)}

td.r,th.r{text-align:right}
tr.cl{cursor:pointer}tr.cl:hover td{background:var(--bg)}
.mt{margin-top:12px}

/* sheet */
.ov{position:fixed;inset:0;background:#0009;z-index:30;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.ov{align-items:center}}
.sh{background:var(--bg);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:8px 8px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){.sh{border-radius:8px}}
.shh{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.shh h2{margin:0;font-weight:900;font-stretch:75%;font-size:26px;text-transform:uppercase;line-height:1}
.x{margin-left:auto;border:0;background:none;font-size:26px;line-height:1;padding:4px 8px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:12px}
.sec h4{margin:0 0 8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:600}
.ln{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.ln:last-child{border-bottom:0}.ln .nm{flex:1;min-width:0}.ln b{font-variant-numeric:tabular-nums}
.qb{width:28px;height:28px;border:1px solid var(--line);background:var(--card);border-radius:3px;font-size:16px;line-height:1}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:13px}.kv span{color:var(--mut)}.kv div{overflow-wrap:anywhere}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.big{flex:1;border:0;background:var(--ink);color:var(--bg);padding:14px;border-radius:4px;font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;min-width:160px}
.big.alt{background:none;color:var(--ink);border:1px solid var(--ink)}

.big.dng.sure{background:var(--bad);color:var(--bg)}
.menu{display:flex;flex-direction:column;gap:10px}
.menu .g{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.menu .g em{font:italic 400 15px var(--s);color:var(--mut);width:100%}
.pick{border:1px solid var(--line);background:var(--card);padding:7px 10px;border-radius:99px;font-size:12px}
.pick:hover{border-color:var(--ink)}.pick small{color:var(--mut);margin-left:4px}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
input[type=text],input[type=tel],input[type=number],textarea,select{width:100%;padding:10px;border:1px solid var(--line);background:var(--card);border-radius:4px}
textarea{resize:vertical}
.row2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:520px){.row2{grid-template-columns:minmax(0,1fr)}}
.err{color:var(--bad);min-height:20px;margin:8px 0 0;font-size:13px}
.ok{color:var(--ok)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--bar);color:var(--barink);padding:10px 16px;border-radius:4px;z-index:40;font-size:13px}
@media(prefers-reduced-motion:no-preference){.card{animation:in .25s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}}}

[hidden]{display:none!important}

.lock{max-width:420px;margin:48px auto;color:var(--mut)}
.lock h1{font-weight:900;font-stretch:75%;text-transform:uppercase;color:var(--ink);margin:0 0 6px}
input[type=email],input[type=password]{width:100%;padding:10px;border:1px solid var(--line);background:var(--card);border-radius:4px}
.hrs{display:flex;flex-direction:column;gap:8px}.hr{display:grid;grid-template-columns:88px auto minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center;font-size:13px}

.sold{border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:99px;font-size:12px;font-weight:600}.sold.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

<script>
const MENU=[
 ["Smash Burgers",[["Twin I",19],["Twin II",20],["Oklahoma",19],["Extra Beef",4],["Lettuce Wrap",2]]],
 ["Sides",[["Fries",6],["Loaded Fries",14],["House Sauce",3],["Sriracha Alioli",3]]],
 ["Sweets",[["Oreo Dessert",8]]],
 ["Drinks",[["Coke Classic",5],["Coke Zero Sugar",5],["Jarritos Mandarin",7],["Jarritos Guava",7],["Jarritos Mango",7],["Water",5]]]];
const ST={
 nuevo:{t:"New",s:"New",next:"prep",btn:"Accept",c:"var(--cheese)"},
 prep:{t:"Preparing",s:"Preparing",next:"listo",btn:"Ready",c:"var(--bun)"},

 const names=["Liam","Olivia","Noah","Mia","Jack","Chloe","Lucas","Ava","Ethan","Zoe","Oscar","Ruby","Leo","Isla","Max","Grace"];
 const flat=MENU.flatMap(c=>c[1]);const P=n=>flat.find(x=>x[0]===n)[1];
 const pick=()=>{const it=[];const b=1+Math.floor(r()*3);for(let i=0;i<b;i++){const bn=["Twin I","Twin II","Oklahoma"][Math.floor(r()*3)];const ex=r()<.3;it.push({n:bn+(ex?" (Extra Beef)":""),q:1,u:P(bn)+(ex?4:0)})}
  if(r()<.75)it.push({n:r()<.35?"Loaded Fries":"Fries",q:1,u:0});if(r()<.5)it.push({n:["Coke Classic","Coke Zero Sugar","Jarritos Mango","Jarritos Guava","Water"][Math.floor(r()*5)],q:1+Math.floor(r()*2),u:0});if(r()<.2)it.push({n:"Oreo Dessert",q:1,u:8});
  const m={};it.forEach(l=>{if(!l.u)l.u=P(l.n);const k=l.n+"|"+l.u;m[k]?m[k].q+=l.q:m[k]={...l}});return Object.values(m)};
 const out=[];let num=1000;const today=dayStart(Date.now());
 for(let d=29;d>=0;d--){const base=today-d*DAY,wk=new Date(base).getDay();const n=d===0?0:(wk===5||wk===6?9:4)+Math.floor(r()*5);
  for(let i=0;i<n;i++){const t=base+(11+Math.floor(r()*10))*36e5+Math.floor(r()*60)*6e4;out.push(mk(t,r()<.04?"cancelado":"entregado"))}}
 const now=Date.now();[[95,"entregado"],[80,"entregado"],[64,"entregado"],[50,"entregado"],[38,"listo"],[29,"prep"],[17,"prep"],[9,"nuevo"],[3,"nuevo"]].forEach(([m,st])=>{const t=now-m*6e4;if(t>today)out.push(mk(t,st))});
 function mk(t,st){const items=pick(),sub=items.reduce((a,l)=>a+l.u*l.q,0),fee=r()<.8?6:0,ch=r()<.75?"WhatsApp":r()<.5?"Walk-in":"Phone";
  return{id:"demo"+(++num),num,createdAt:t,status:st,customer:names[Math.floor(r()*names.length)],phone:"",address:ch==="Walk-in"?"":"Palm Beach",notes:"",items,subtotal:sub,fee:ch==="Walk-in"?0:fee,total:sub+(ch==="Walk-in"?0:fee),pay:PAYS[Math.floor(r()*3)],channel:ch}}
 return out.sort((a,b)=>b.createdAt-a.createdAt);
}

async function patch(o,fields){
 if(busy.has(o.id))return;
 if(!supa||!session){toast("Your session ended. Please log in again.");return}
 const now=new Date().toISOString(),u={},s=fields.status;
 if(s){u.status=s==="entregado"?"retirado":s;
  if(s==="prep"&&o.status==="nuevo"){u.accepted_at=now;u.eta_min=fields.eta||ETA}
  if(s==="listo"&&o.status==="prep")u.ready_at=now;
  if(s==="entregado")u.picked_up_at=now;
  if(s==="cancelado")u.cancelled_at=now;
  if(s==="nuevo"){u.cancelled_at=null;u.accepted_at=null;u.eta_min=null}}
 busy.add(o.id);render();
 const {error}=await supa.from("orders").update(u).eq("id",o.id);
 if(error)toast("Couldn't save. Check the connection and try again.");
 busy.delete(o.id);await refreshOne(o.id);
}

function stats(list){const ok=list.filter(o=>o.status!=="cancelado"&&o.status!=="pago_pendiente"),tot=ok.reduce((a,o)=>a+(+o.total||0),0);return{ok,tot,n:ok.length,avg:ok.length?tot/ok.length:0,canc:list.filter(o=>o.status==="cancelado").length,comm:Math.round(tot*PCT)/100}}

function niceMax(v){if(v<=0)return 10;const e=Math.pow(10,Math.floor(Math.log10(v))),f=v/e;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}
function barChart(vals,labels,every){
 const W=640,H=230,L=46,R=8,T=12,B=26,max=niceMax(Math.max(...vals,0)),bw=(W-L-R)/vals.length,top=Math.max(...vals);

 vals.forEach((v,i)=>{const h=(H-T-B)*v/max,x=L+i*bw+bw*.15;g+=`<rect class="bar${v===top&&v>0?" max":""}" x="${x.toFixed(1)}" y="${(H-B-h).toFixed(1)}" width="${(bw*.7).toFixed(1)}" height="${h.toFixed(1)}" rx="2"><title>${labels[i]}: ${money(v)}</title></rect>`;
  if(i%every===0)g+=`<text class="ax" x="${(L+i*bw+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${labels[i]}</text>`});

const TZ=10*36e5;
const wkStart=t=>{const d=new Date(t+TZ),dow=(d.getUTCDay()+6)%7;return Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())-dow*DAY-TZ};
const lday=t=>{const d=new Date(t+TZ);return pad(d.getUTCDate())+"/"+pad(d.getUTCMonth()+1)};
const liso=t=>new Date(t+TZ).toISOString().slice(0,10);
function weeks(){const cur=wkStart(Date.now()),out=[];for(let k=0;k<8;k++){const a=cur-k*7*DAY,b=a+7*DAY;
 const os=orders().filter(o=>o.status!=="cancelado"&&o.status!=="pago_pendiente"&&o.createdAt>=a&&o.createdAt<b);
 out.push({a,b,key:liso(a),n:os.length,sales:os.reduce((s,o)=>s+(+o.total||0),0),comm:Math.round(os.reduce((s,o)=>s+(+o.total||0),0)*PCT)/100,cur:k===0,payDay:a+8*DAY})}return out}

function sales(){
 const R=range(period),all=orders(),cur=all.filter(o=>o.createdAt>=R.a&&o.createdAt<R.b),prev=all.filter(o=>o.createdAt>=R.pa&&o.createdAt<R.pb);
 const S=stats(cur),P=stats(prev);
 let vals=[],labels=[],every=1,title;
 if(period==="hoy"){let h0=11,h1=22;S.ok.forEach(o=>{const h=new Date(o.createdAt).getHours();h0=Math.min(h0,h);h1=Math.max(h1,h)});
  for(let h=h0;h<=h1;h++){labels.push(h+"h");vals.push(S.ok.filter(o=>new Date(o.createdAt).getHours()===h).reduce((a,o)=>a+(+o.total||0),0))}every=labels.length>12?2:1;title="Sales by hour"}
 else{for(let t=R.a;t<R.b;t+=DAY){labels.push(fmtDate(t));vals.push(S.ok.filter(o=>o.createdAt>=t&&o.createdAt<t+DAY).reduce((a,o)=>a+(+o.total||0),0))}every=period==="7"?1:5;title="Sales by day"}
 const prod={};S.ok.forEach(o=>(o.items||[]).forEach(l=>{const k=String(l.n).replace(/\s*\(.*\)$/,"");prod[k]=prod[k]||{q:0,v:0};prod[k].q+=+l.q||0;prod[k].v+=(+l.q||0)*(+l.u||0)}));
 const top=Object.entries(prod).sort((a,b)=>b[1].q-a[1].q).slice(0,6),tq=top[0]?.[1].q||1;
 const brk=(key,list,cols)=>{const m={};S.ok.forEach(o=>{const k=o[key]||"Other";m[k]=(m[k]||0)+(+o.total||0)});const ent=list.concat(Object.keys(m).filter(k=>!list.includes(k))).filter(k=>m[k]);
  if(!ent.length)return`<p class="note">No sales in this period.</p>`;
  return`<div class="split">${ent.map((k,i)=>`<i style="width:${m[k]/S.tot*100}%;background:${cols[i%cols.length]}"></i>`).join("")}</div><div class="leg">${ent.map((k,i)=>`<div><span class="dot" style="background:${cols[i%cols.length]}"></span>${esc(k)}<b>${money(m[k])} · ${Math.round(m[k]/S.tot*100)}%</b></div>`).join("")}</div>`};
 const cols=["var(--ink)","var(--mut)","var(--bun)","var(--line)"];
 const hist=cur.slice().sort((a,b)=>b.createdAt-a.createdAt).slice(0,60);
 return`<div class="sum"><h1>Sales</h1><div class="seg" role="group" aria-label="Period">${[["hoy","Today"],["7","7 days"],["30","30 days"]].map(([k,t])=>`<button data-per="${k}" aria-pressed="${period===k}">${t}</button>`).join("")}</div></div>
 <div class="kpis">
  <div class="kpi hero"><div class="l">Sales</div><div class="v">${money(S.tot)}</div><div class="d">${delta(S.tot,P.tot,R.vs)}</div></div>
  <div class="kpi"><div class="l">Orders</div><div class="v">${S.n}</div><div class="d">${delta(S.n,P.n,R.vs)}</div></div>
  <div class="kpi"><div class="l">Average order</div><div class="v">${money(S.avg)}</div><div class="d">${delta(S.avg,P.avg,R.vs)}</div></div>
  <div class="kpi"><div class="l">Commission ${PCT}%</div><div class="v">${money(S.comm)}</div><div class="d">${PCT}% of sales · ${S.canc} cancelled</div></div>
 </div>
 <div class="grid2">
  <div class="panel chart"><h3>${title}</h3><p class="note">Order totals, excluding cancelled. AUD.</p>${S.n?barChart(vals,labels,every):`<div class="empty">No sales in this period yet.</div>`}</div>
  <div class="panel"><h3>Best sellers</h3><p class="note">Units sold in this period.</p>${top.length?`<ol class="rank">${top.map(([k,v])=>`<li><span>${esc(k)}</span><b>${v.q} sold · ${money(v.v)}</b><span class="bt"><i style="width:${v.q/tq*100}%"></i></span></li>`).join("")}</ol>`:`<div class="empty">No items sold yet.</div>`}</div>
 </div>
 <div class="grid2 mt">
  <div class="panel"><h3>History</h3><p class="note">${cur.length} orders in this period. Tap one to see the details.</p>${hist.length?`<div class="tw"><table><thead><tr><th>#</th><th>Date</th><th>Customer</th><th>Channel</th><th>Payment</th><th>Status</th><th class="r">Total</th></tr></thead><tbody>${hist.map(o=>`<tr class="cl" data-open="${esc(o.id)}"><td>${o.num}</td><td>${fmtDate(o.createdAt)} ${hm(o.createdAt)}</td><td>${esc(o.customer||"—")}</td><td>${esc(o.channel||"")}</td><td>${esc(o.pay||"")}</td><td><span class="chip c-${o.status}" style="margin:0">${ST[o.status]?.s||esc(o.status)}</span></td><td class="r">${money(o.total)}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">No orders in this period.</div>`}</div>
  <div style="display:flex;flex-direction:column;gap:12px;min-width:0">
   <div class="panel"><h3>Payment methods</h3>${brk("pay",PAYS,cols)}</div>
   <div class="panel"><h3>Channel</h3>${brk("channel",CHANS,cols)}</div>
  </div>
 </div>${role==="admin"?commSection():""}`;
}

function parseWA(txt){const lines=[],info={};
 txt.split(/\r?\n/).forEach(r=>{r=r.trim();if(!r)return;
  let m=r.match(/^(\d+)\s*[×xX]\s*(.+?)\s+[–—-]\s*\$?\s*([\d.,]+)\s*$/);
  if(m){const q=+m[1]||1,t=parseFloat(m[3].replace(",","."))||0;lines.push({n:m[2].trim(),q,u:Math.round(t/q*100)/100});return}
  m=r.match(/^([A-Za-zÀ-ÿ]+)\s*:\s*(.+)$/);if(!m)return;const k=m[1].toLowerCase(),v=m[2].trim();
  if(/^(name|nombre)$/.test(k))info.customer=v;else if(/^(phone|tel)/.test(k))info.phone=v;else if(/^(address|direcci)/.test(k))info.address=v;else if(/^(notes|notas)$/.test(k))info.notes=v});

  const q=t.closest("[data-q]");if(q){syncForm();const l=form.lines[+q.dataset.q];l.q+=+q.dataset.d;if(l.q<=0)form.lines.splice(+q.dataset.q,1);drawForm();return}
  if(act==="parse"){syncForm();const r=parseWA(form.paste);if(!r.lines.length){drawForm("No items found in the message. Copy the full message from WhatsApp.");return}
   r.lines.forEach(l=>addLine(l.n,l.u,l.q));Object.assign(form,Object.fromEntries(Object.entries(r.info).filter(([,v])=>v)));if(r.info.address)form.channel="WhatsApp";form.paste="";drawForm(`<span class="ok">Found ${r.lines.length} item${r.lines.length>1?"s":""}. Check them and add delivery.</span>`);return}
  if(act==="save"){saveOrder();return}
 }
 const op=t.closest("[data-open]");if(op&&!form){openOrder(op.dataset.open)}
});
document.addEventListener("change",e=>{const m=/^h-c(\d)$/.exec(e.target.id||"");if(m){$("#h-o"+m[1]).disabled=e.target.checked;$("#h-x"+m[1]).disabled=e.target.checked}});
document.addEventListener("input",e=>{if(form&&e.target.id==="f-fee"){syncForm();const s=form.lines.reduce((a,l)=>a+l.u*l.q,0);const el=$("#f-tot");if(el)el.textContent=money(s+(+form.fee||0))}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&(openId||form))closeSheet()});
setInterval(()=>{if(role&&Date.now()-lastLoad>120000){loadAll(false);loadLocal().then(()=>{if(tab!=="local")render()})}if(tab==="pedidos"&&!document.hidden)render();if(openId)drawOrder()},30000);
boot();
</script>
</body></html>
